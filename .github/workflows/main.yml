name: Build Instagram Focus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project archive
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP archive found in repository root."
            exit 1
          fi

          echo "Extracting: $ARCHIVE"
          unzip -oq "$ARCHIVE" -d extracted

          TAR_FILE=$(find extracted -type f -iname "*.tar.gz" -print -quit)

          if [ -n "$TAR_FILE" ]; then
            echo "Extracting nested archive: $TAR_FILE"
            mkdir -p project
            tar -xzf "$TAR_FILE" -C project
          else
            mkdir -p project
            cp -a extracted/. project/
          fi

          echo "Searching for Gradle settings..."
          find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found in the archive."
            exit 1
          fi

          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Focus-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
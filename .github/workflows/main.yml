name: Diagnose Instagram Focus Gradle

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          test -n "$ARCHIVE" || {
            echo "No ZIP found in repository root"
            exit 1
          }

          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted

      - name: Print Gradle configuration
        shell: bash
        run: |
          echo "=== Gradle wrapper ==="
          find extracted -name gradle-wrapper.properties \
            -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

          echo "=== Root Gradle build files ==="
          find extracted -maxdepth 3 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print

          find extracted -maxdepth 3 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -exec sh -c 'echo "--- $1"; sed -n "1,180p" "$1"' _ {} \;

          echo "=== Settings files ==="
          find extracted -maxdepth 3 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -exec sh -c 'echo "--- $1"; sed -n "1,160p" "$1"' _ {} \;
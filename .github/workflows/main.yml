name: Build Instagram Focus APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle directly
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Project found: $(dirname "$SETTINGS")"

      - name: Build debug APK without wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramFocus-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error